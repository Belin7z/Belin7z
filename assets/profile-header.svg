<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="320" viewBox="0 0 1280 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Belin7z profile header</title>
  <desc id="desc">Deep-space banner for the Belin7z GitHub profile README.</desc>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.5" stop-color="#0b0713"/>
      <stop offset="1" stop-color="#1e1033"/>
    </linearGradient>
    <radialGradient id="nebulaViolet" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 60) rotate(110) scale(420 300)">
      <stop stop-color="#6D28D9" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6D28D9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaBlue" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(160 280) rotate(-40) scale(360 240)">
      <stop stop-color="#4C1D95" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4C1D95" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shootFade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(640 160) scale(760 420)">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.65" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="cardClip">
      <rect width="1280" height="320" rx="28"/>
    </clipPath>
  </defs>

  <rect width="1280" height="320" rx="28" fill="url(#space)"/>

